name: barboo-chatwoot-prod

services:
  chatwoot-web:
    build:
      context: .
      dockerfile: docker/chatwoot/Dockerfile
      args:
        CHATWOOT_TAG: ${CHATWOOT_TAG:-latest}
    image: ${CHATWOOT_IMAGE:-barboo/chatwoot:latest}
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      FORCE_SSL: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ruby -rsocket -e 'TCPSocket.new(\"127.0.0.1\", 3000).close'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  chatwoot-worker:
    image: ${CHATWOOT_IMAGE:-barboo/chatwoot:latest}
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      FORCE_SSL: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

# Em Railway, NAO suba postgres/redis neste compose.
# Use servicos gerenciados e configure via:
# - POSTGRES_HOST, POSTGRES_DATABASE, POSTGRES_USERNAME, POSTGRES_PASSWORD
# - REDIS_URL e REDIS_PASSWORD (se aplicavel)
# - ACTIVE_STORAGE_SERVICE=s3 (recomendado para persistencia de anexos)
